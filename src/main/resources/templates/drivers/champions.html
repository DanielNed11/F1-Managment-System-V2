<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Champion Drivers')}"></head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container my-4">
    <h1 class="mb-4">
        <i class="bi bi-trophy-fill text-warning"></i> <span th:text="#{page.champions.heading}">Champion Drivers</span>
    </h1>

    <p class="lead" >Drivers who have won at least one World Championship</p>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:if="${!#lists.isEmpty(drivers)}">
        <div class="col" th:each="driver : ${drivers}">
            <div class="card h-100">
                <img th:src="@{${driver.imageUrl}}" class="card-img-top" th:alt="${driver.name}"
                     style="height: 200px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title">
                        <a th:href="@{/drivers/{id}(id=${driver.id})}" th:text="${driver.name}">Driver Name</a>
                    </h5>
                    <p class="card-text">
                        <span class="badge bg-primary" th:text="${driver.nationality}">Nationality</span>
                    </p>
                    <p class="card-text">
                        <strong><i class="bi bi-trophy-fill text-warning"></i> Championships:</strong>
                        <span class="fs-4 text-warning fw-bold" th:text="${driver.worldChampionships}">0</span>
                    </p>
                    <p class="card-text" th:if="${driver.team != null}">
                        <strong>Team:</strong> <span th:text="${driver.team.name}">Team</span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(drivers)}" class="alert alert-info">
        <p th:text="#{msg.noChampions}">No champion drivers found.</p>
    </div>

    <p class="mt-3">
        <strong th:text="#{label.totalChampions} + ': ' + ${#lists.size(drivers)}">Total Champions</strong>
    </p>

    <a th:href="@{/drivers}" class="btn btn-secondary mt-3">
        <i class="bi bi-arrow-left"></i> <span th:text="#{button.backToDrivers}">Back to All Drivers</span>
    </a>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
