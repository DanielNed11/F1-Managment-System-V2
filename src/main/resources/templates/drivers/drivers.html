<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{page.drivers.title}">All Drivers</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/navbar :: menu}"></nav>

<h1 th:text="#{page.drivers.heading}">Drivers</h1>

<form th:action="@{/drivers}" method="get">
    <label th:text="#{label.nationality} + ':'"></label>
        <input type="text" name="nationality" th:value="${nationality}" placeholder="e.g. British" />


    <label th:text="#{label.dateOfBirth} + ':'"></label>
        <input type="date" name="dateOfBirth"
               th:value="${dateOfBirth != null} ? ${#temporals.format(dateOfBirth, 'yyyy-MM-dd')} : ''" />


    <button type="submit" th:text="#{button.filter}">Filter</button>
    <a th:href="@{/drivers}" th:text="#{button.clear}">Clear</a>
</form>

<table>
    <thead>
    <tr>
        <th th:text="#{table.header.id}"></th>
        <th th:text="#{table.header.name}"></th>
        <th th:text="#{table.header.team}"></th>
        <th th:text="#{table.header.races}"></th>
        <th th:text="#{table.header.nationality}"></th>
        <th th:text="#{table.header.dateOfBirth}"></th>
        <th th:text="#{table.header.worldChampionships}"></th>
        <th th:text="#{table.header.edit}">Edit</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="driver : ${drivers}">
        <td th:text="${driver.id}"></td>
        <td th:text="${driver.name}"></td>
        <td th:text="${driver.team?.name ?: 'No Team'}"></td>
        <td>
            <details>
                <summary th:text="#{details.showRaces}"></summary>
                <ul>
                    <li th:each="race : ${driver.races}" th:text="${race.name}"></li>
                </ul>
            </details>
        </td>
        <td th:text="${driver.nationality}"></td>
        <td th:text="${driver.dateOfBirth}"></td>
        <td th:text="${driver.worldChampionships}"></td>
        <td><a th:href="@{/drivers/edit/{id}(id=${driver.id})}" th:text="#{table.header.edit}"></a></td>
    </tr>
    </tbody>
</table>
<p>
    <strong th:text="#{label.totalDrivers} + ': ' + ${#lists.size(drivers)}"></strong>
</p>
</body>
</html>
