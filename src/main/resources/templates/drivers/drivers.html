<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<script src="/js/driver.js"></script>
<head th:replace="~{fragments/header :: head(#{page.drivers.title})}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="hero-section">
    <div class="container">
        <h1 class="display-4">
            <i class="bi bi-person-circle me-3"></i><span th:text="#{page.drivers.heading}">Drivers</span>
        </h1>
        <p class="lead mb-4" th:text="#{page.drivers.description}">Browse all Formula 1 drivers and their
            achievements</p>
        <a class="btn btn-success btn-lg" th:href="@{/drivers/add}">
            <i class="bi bi-person-plus me-2"></i><span th:text="#{button.addDriver}">Add New Driver</span>
        </a>
    </div>
</div>

<div class="container">
    <div class="filter-section">
        <h5 class="mb-3"><i class="bi bi-funnel me-2"></i><span
                th:text="#{filter.drivers.heading}">Filter Drivers</span></h5>
        <form class="row g-3" method="get" th:action="@{/drivers}">
            <div class="col-md-4">
                <label class="form-label" th:text="#{label.nationality}">Nationality</label>
                <input class="form-control" name="nationality" th:placeholder="#{label.nationality}"
                       th:value="${nationality}" type="text"/>
            </div>

            <div class="col-md-4">
                <label class="form-label" th:text="#{label.dateOfBirth}">Date of Birth</label>
                <input class="form-control" name="dateOfBirth" th:value="${dateOfBirth != null} ? ${#temporals.format(dateOfBirth, 'yyyy-MM-dd')} : ''"
                       type="date"/>
            </div>

            <div class="col-md-4 d-flex align-items-end gap-2">
                <button class="btn btn-primary flex-fill" type="submit">
                    <i class="bi bi-search me-1"></i><span th:text="#{button.filter}">Filter</span>
                </button>
                <a class="btn btn-outline-secondary flex-fill" th:href="@{/drivers}">
                    <i class="bi bi-x-circle me-1"></i><span th:text="#{button.clear}">Clear</span>
                </a>
            </div>
        </form>
    </div>

    <div class="row mb-4">
        <div class="col-md-4 col-lg-3">
            <div class="stats-card shadow-custom">
                <div class="card-body text-center">
                    <i class="bi bi-person-circle"></i>
                    <h3 class="mt-2 mb-0" id="driversCount" th:text="${#lists.size(drivers)}">0</h3>
                    <p class="mb-0" th:text="#{label.totalDrivers}">Total Drivers</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
        <div class="col" th:each="driver : ${drivers}" th:attr="data-driver-id=${driver.id}">
            <div class="card h-100 shadow-custom">
                <img class="card-img-top"
                     th:alt="${driver.name}"
                     th:src="${driver.imageUrl}"/>

                <div class="card-body">
                    <h5 class="card-title fw-bold" th:text="${driver.name}">Name</h5>
                    <div class="mb-2">
                        <span class="badge bg-primary" th:text="${driver.nationality}">Nationality</span>
                    </div>
                    <div class="mb-2 text-muted small">
                        <i class="bi bi-calendar me-1"></i>
                        <span th:text="${driver.dateOfBirth}">Date of Birth</span>
                    </div>
                    <div class="mb-2">
                        <i class="bi bi-trophy-fill text-warning me-1"></i>
                        <strong th:text="${driver.worldChampionships}">0</strong>
                        <span class="text-muted small" th:text="#{table.header.worldChampionships}">Championships</span>
                    </div>
                </div>

                <div class="card-footer d-flex gap-2">
                    <a class="btn btn-sm btn-outline-primary flex-fill"
                       th:href="@{/drivers/{id}(id=${driver.id})}">
                        <i class="bi bi-eye me-1"></i><span th:text="#{button.viewDetails}">View</span>
                    </a>
                    <button class="btn btn-sm btn-outline-danger deleteDriverBtn"
                            th:data-id="${driver.id}">
                        <i class="bi bi-trash me-1"></i>
                        <span th:text="#{button.delete}">Delete</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
