<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/header :: head(#{page.drivers.title})}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-4">
    <h1 class="mb-4" th:text="#{page.drivers.heading}">Drivers</h1>

    <form class="row gy-2 gx-3 align-items-center mb-4" th:action="@{/drivers}" method="get">
        <div class="col-auto">
            <input type="text" class="form-control" name="nationality"
                   th:value="${nationality}" th:placeholder="#{label.nationality}" />
        </div>

        <div class="col-auto">
            <input type="date" class="form-control" name="dateOfBirth"
                   th:value="${dateOfBirth != null} ? ${#temporals.format(dateOfBirth, 'yyyy-MM-dd')} : ''" />
        </div>

        <div class="col-auto d-flex align-items-end gap-2">
            <button type="submit" class="btn btn-primary" th:text="#{button.filter}"></button>
            <a class="btn btn-outline-secondary" th:href="@{/drivers}" th:text="#{button.clear}"></a>
        </div>
    </form>

    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-4 g-4">
        <div class="col" th:each="driver : ${drivers}">
            <div class="card h-100 shadow-sm">
                <img class="card-img-top"
                     th:src="${driver.imageUrl}"
                     th:alt="${driver.name}" />

                <div class="card-body">
                    <h5 class="card-title" th:text="${driver.name}">Name</h5>
                    <span class="badge text-bg-primary" th:text="${driver.nationality}">Nationality</span>
                </div>

                <div class="card-footer bg-white">
                    <a class="btn btn-sm btn-outline-primary w-100"
                       th:href="@{/drivers/{id}(id=${driver.id})}"
                       th:text="#{button.viewDetails}"></a>
                </div>
            </div>
        </div>
    </div>

    <p class="mt-3">
        <strong th:text="#{label.totalDrivers} + ': ' + ${#lists.size(drivers)}"></strong>
    </p>

    <a class="btn btn-sm btn-primary w-100"
       th:text="#{button.addDriver}"
       th:href="@{/drivers/add}"></a>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
