<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head th:replace="~{fragments/header :: head(#{page.driver.edit.title})}">
  </head>
  <body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <main class="container my-4">
      <h1 class="mb-4" th:text="#{page.driver.edit.heading}"></h1>

      <form
        class="row g-3"
        th:action="@{/drivers/edit/{id}(id=${driverId})}"
        th:object="${driverDTO}"
        method="post"
      >
        <div class="col-md-6">
          <label class="form-label" th:text="#{label.name} + ':'"></label>
          <input
            type="text"
            class="form-control"
            th:field="*{name}"
            th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
          />
          <div
            class="invalid-feedback"
            th:if="${#fields.hasErrors('name')}"
            th:errors="*{name}"
          >
          </div>
        </div>

        <div class="col-md-6" sec:authorize="hasRole('ADMIN')">
          <label class="form-label" th:text="#{label.setTeam} + ':'"></label>
          <select class="form-select" th:field="*{teamId}">
            <option th:value="0" th:text="#{option.noTeam}"></option>
            <option
              th:each="team : ${teams}"
              th:value="${team.id}"
              th:text="${team.name}"
            >
            </option>
          </select>
        </div>

        <div class="col-md-6">
          <label
            class="form-label"
            th:text="#{label.nationality} + ':'"
          ></label>
          <input
            type="text"
            class="form-control"
            th:field="*{nationality}"
            th:classappend="${#fields.hasErrors('nationality')} ? 'is-invalid' : ''"
          />
          <div
            class="invalid-feedback"
            th:if="${#fields.hasErrors('nationality')}"
            th:errors="*{nationality}"
          >
          </div>
        </div>

        <div class="col-md-6">
          <label
            class="form-label"
            th:text="#{label.dateOfBirth} + ':'"
          ></label>
          <input
            type="date"
            class="form-control"
            th:field="*{dateOfBirth}"
            th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid' : ''"
          />
          <div
            class="invalid-feedback"
            th:if="${#fields.hasErrors('dateOfBirth')}"
            th:errors="*{dateOfBirth}"
          >
          </div>
        </div>

        <div class="col-md-6">
          <label
            class="form-label"
            th:text="#{label.worldChampionships} + ':'"
          ></label>
          <input
            type="number"
            class="form-control"
            th:field="*{worldChampionships}"
            th:classappend="${#fields.hasErrors('worldChampionships')} ? 'is-invalid' : ''"
          />
          <div
            class="invalid-feedback"
            th:if="${#fields.hasErrors('worldChampionships')}"
            th:errors="*{worldChampionships}"
          >
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label" th:text="'Image URL:'"></label>
          <input
            type="text"
            class="form-control"
            th:field="*{imageUrl}"
            th:classappend="${#fields.hasErrors('imageUrl')} ? 'is-invalid' : ''"
            placeholder="/img/driver.png"
          />
          <div
            class="invalid-feedback"
            th:if="${#fields.hasErrors('imageUrl')}"
            th:errors="*{imageUrl}"
          >
          </div>
        </div>

        <div class="col-12 d-flex justify-content-end">
          <button
            type="submit"
            class="btn btn-primary"
            th:text="#{button.updateDriver}"
          >
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
