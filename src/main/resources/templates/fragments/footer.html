<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<footer th:fragment="footer" class="bg-dark text-white mt-5">
    <div class="container py-4">
        <div class="row">
            <!-- Quick Links - Only visible on large screens -->
            <div class="col-lg-8 mb-3 mb-lg-0 d-none d-lg-block">
                <h6 class="fw-bold text-uppercase mb-3" th:text="#{footer.quickLinks}">Quick Links</h6>
                <div class="row">
                    <div class="col-md-3">
                        <a th:href="@{/drivers}" class="text-white-50 text-decoration-none d-block mb-2">
                            <i class="bi bi-chevron-right me-1"></i><span th:text="#{menu.allDrivers}">Drivers</span>
                        </a>
                        <a th:href="@{/drivers/champions}" class="text-white-50 text-decoration-none d-block mb-2">
                            <i class="bi bi-trophy me-1"></i><span th:text="#{page.champions.heading}">Champions</span>
                        </a>
                    </div>
                    <div class="col-md-3">
                        <a th:href="@{/teams}" class="text-white-50 text-decoration-none d-block mb-2">
                            <i class="bi bi-chevron-right me-1"></i><span th:text="#{menu.allTeams}">Teams</span>
                        </a>
                    </div>
                    <div class="col-md-3">
                        <a th:href="@{/tracks}" class="text-white-50 text-decoration-none d-block mb-2">
                            <i class="bi bi-chevron-right me-1"></i><span th:text="#{menu.allTracks}">Tracks</span>
                        </a>
                        <a th:href="@{/tracks/long-tracks}" class="text-white-50 text-decoration-none d-block mb-2">
                            <i class="bi bi-rulers me-1"></i><span th:text="#{page.longTracks.heading}">Long Tracks</span>
                        </a>
                    </div>
                    <div class="col-md-3">
                        <a th:href="@{/races}" class="text-white-50 text-decoration-none d-block mb-2">
                            <i class="bi bi-chevron-right me-1"></i><span th:text="#{menu.allRaces}">Races</span>
                        </a>
                        <a th:href="@{/races/upcoming}" class="text-white-50 text-decoration-none d-block mb-2">
                            <i class="bi bi-calendar-event me-1"></i><span th:text="#{page.upcomingRaces.heading}">Upcoming</span>
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 col-12 text-lg-end text-center">
                <p class="text-white-50 small mb-2">
                    <i class="bi bi-lightning-charge me-2"></i><span th:text="#{footer.largeOnly}">Made by Daniel Nedyalkov</span>
                </p>
            </div>
        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>

</footer>
</body>
</html>
