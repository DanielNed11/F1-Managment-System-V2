<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">

<head th:replace="~{fragments/header :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container my-4">
    <h1 class="mb-3">Login</h1>
    <p class="text-muted mb-4">Use one of the demo accounts below to sign in.</p>

    <div th:if="${param.error}" class="alert alert-danger">
        Invalid username or password.
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
        You have been logged out.
    </div>

    <section class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <h2 class="h5 mb-3">Demo Accounts</h2>
            <p class="small text-muted mb-3">
                These are assignment dummy credentials shown for quick testing.
            </p>
            <ul class="list-group list-group-flush">
                <li class="list-group-item px-0 d-flex justify-content-between align-items-center">
                    <span><strong>Daniel</strong></span>
                    <span class="font-monospace small">Dani</span>
                </li>
                <li class="list-group-item px-0 d-flex justify-content-between align-items-center">
                    <span><strong>Ivan</strong></span>
                    <span class="font-monospace small">Ivan</span>
                </li>
                <li class="list-group-item px-0 d-flex justify-content-between align-items-center">
                    <span><strong>Viki</strong></span>
                    <span class="font-monospace small">Viki</span>
                </li>
            </ul>
        </div>
    </section>

    <form class="row g-3" th:action="@{/login}" method="post">
        <div class="col-md-6">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-control" required/>
        </div>

        <div class="col-md-6">
            <label for="password" class="form-label">Password</label>
            <input type="password" name="password" id="password" class="form-control" required/>
        </div>

        <div class="col-12 d-flex justify-content-end">
            <button type="submit" class="btn btn-primary">Submit</button>
        </div>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
