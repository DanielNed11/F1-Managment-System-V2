<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/header :: head(#{page.race.add.title})}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<h1 th:text="#{page.race.add.heading}"></h1>

<form th:action="@{/races/add}" method="post">

    <label th:text="#{label.name} + ':'"></label>
    <input type="text" name="name" required>

    <br>

    <label th:text="#{label.date} + ':'"></label>
    <input type="date" name="date" required>

    <br>

    <label th:text="#{label.track} + ':'"></label>
    <select name="trackId">
        <option th:each="track : ${tracks}"
                th:value="${track.id}"
                th:text="${track.name}">
        </option>
    </select>

    <br>

    <h3 th:text="#{label.addDrivers}">Select Drivers</h3>
    <p class="text-muted">Check the drivers who will participate in this race.</p>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Participated</th>
                <th>Driver</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="driver : ${drivers}">
                <td>
                    <input type="checkbox"
                           name="participatingDriverIds"
                           th:value="${driver.id}"
                           th:id="${'driver-' + driver.id}"/>
                </td>
                <td>
                    <label th:for="${'driver-' + driver.id}" th:text="${driver.name}">Driver Name</label>
                </td>
            </tr>
        </tbody>
    </table>

    <br>

    <label th:text="#{table.header.winner} + ':'"></label>
    <select name="winnerId">
        <option value="" th:text="#{msg.noWinner}">No Winner</option>
        <option th:each="driver : ${drivers}"
                th:value="${driver.id}"
                th:text="${driver.name}">
        </option>
    </select>

    <br><br>

    <button type="submit" th:text="#{button.addRace}"></button>
</form>

</body>
</html>
