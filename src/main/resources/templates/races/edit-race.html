<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/header :: head(#{page.race.edit.title})}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<h1 th:text="#{page.race.edit.heading}"></h1>

<form th:action="@{/races/edit/{id}(id=${race.id})}" th:object="${race}" method="post">

    <label th:text="#{label.name} + ':'"></label>
    <input type="text" th:field="*{name}" />

    <br>

    <label th:text="#{label.track} + ':'"></label>
    <select th:field="*{track.id}">
        <option th:each="track : ${tracks}"
                th:value="${track.id}"
                th:text="${track.name}">
        </option>
    </select>

    <br>

    <h3 th:text="#{section.selectDrivers}">Select Drivers</h3>
    <p th:if="${race.hasEnded}" class="alert alert-info">
        <strong>Race has ended.</strong> Check participating drivers and enter their finishing positions.
    </p>
    <p th:if="${!race.hasEnded}" class="text-muted">
        Check the drivers who will participate in this race. You can optionally enter positions.
    </p>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Participated</th>
                <th>Driver</th>
                <th>Position</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="driver : ${drivers}">
                <td>
                    <input type="checkbox"
                           name="participatingDriverIds"
                           th:value="${driver.id}"
                           th:checked="${#lists.contains(race.raceDrivers.![driver.id], driver.id)}"
                           th:id="${'driver-' + driver.id}"/>
                </td>
                <td>
                    <label th:for="${'driver-' + driver.id}" th:text="${driver.name}">Driver Name</label>
                </td>
                <td>
                    <input type="number"
                           th:name="${'driverPosition_' + driver.id}"
                           th:value="${driverPositionsMap.get(driver.id)}"
                           placeholder="Position"
                           min="1"
                           class="form-control"
                           style="width: 100px;"/>
                </td>
            </tr>
        </tbody>
    </table>

    <br>

    <label th:text="#{table.header.winner} + ':'"></label>
    <select name="winnerId">
        <option value="" th:text="#{msg.noWinner}">No Winner</option>
        <option th:each="driver : ${drivers}"
                th:value="${driver.id}"
                th:text="${driver.name}"
                th:selected="${race.winner != null && race.winner.id == driver.id}">
        </option>
    </select>

    <br><br>
    <button type="submit" th:text="#{button.updateRace}"></button>
</form>

<br>
</body>
</html>
