<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/header :: head(#{page.race.edit.title})}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<h1 th:text="#{page.race.edit.heading}"></h1>

<form th:action="@{/races/edit/{id}(id=${race.id})}" th:object="${race}" method="post">

    <label th:text="#{label.name} + ':'"></label>
    <input type="text" th:field="*{name}" />

    <br>

    <label th:text="#{label.track} + ':'"></label>
    <select th:field="*{track.id}">
        <option th:each="track : ${tracks}"
                th:value="${track.id}"
                th:text="${track.name}">
        </option>
    </select>

    <br>

    <h3 th:text="#{section.addDrivers}"></h3>
    <label th:text="#{label.drivers} + ':'"></label>
    <select name="driverIds" multiple>
        <option th:each="driver : ${drivers}"
                th:value="${driver.id}"
                th:text="${driver.name}"
                th:selected="${#lists.contains(race.driverRaces.![driver.id], driver.id)}">
        </option>
    </select>

    <br>

    <label th:text="#{table.header.winner} + ':'"></label>
    <select name="winnerId">
        <option value="" th:text="#{msg.noWinner}">No Winner</option>
        <option th:each="driver : ${drivers}"
                th:value="${driver.id}"
                th:text="${driver.name}"
                th:selected="${race.winner != null && race.winner.id == driver.id}">
        </option>
    </select>

    <br><br>
    <button type="submit" th:text="#{button.updateRace}"></button>
</form>

<h3 th:text="#{section.driversInRace}"></h3>
<ul>
    <li th:each="driverRace : ${race.driverRaces}">
        <span th:text="${driverRace.driver.name}"></span>
        <form th:action="@{/races/{raceId}/remove-driver/{driverId}(raceId=${race.id}, driverId=${driverRace.driver.id})}" method="post" style="display:inline;">
            <button type="submit" th:text="#{button.remove}"></button>
        </form>
    </li>
</ul>

<br>
</body>
</html>
