<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(#{page.race.title})}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-4">
    <h1 class="mb-4" th:text="#{page.races.title}">Race</h1>

    <table class="table table-striped table-hover align-middle">
        <thead class="table-light">
        <tr>
            <th th:text="#{table.header.id}">ID</th>
            <th th:text="#{table.header.name}">Name</th>
            <th th:text="#{table.header.date}">Date</th>
            <th th:text="#{table.header.track}">Track</th>
            <th th:text="#{table.header.winner}">Winner</th>
            <th th:text="#{table.header.edit}">Edit</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td th:text="${race.id}"></td>
            <td><strong th:text="${race.name}"></strong></td>
            <td th:text="${race.date}"></td>
            <td>
                <a th:if="${race.track != null}"
                   th:href="@{/tracks/{id}(id=${race.track.id})}"
                   th:text="${race.track.name}"></a>
            </td>
            <td>
                <a th:if="${race.winner != null}"
                   th:href="@{/drivers/{id}(id=${race.winner.id})}"
                   th:text="${race.winner.name}"></a>
                <span th:if="${race.winner == null}" class="text-muted">-</span>
            </td>
            <td>
                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{/races/edit/{id}(id=${race.id})}">
                    <i class="bi bi-pencil-square"></i>
                    <span th:text="#{table.header.edit}"></span>
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <h3 class="mt-5 mb-3" th:text="#{table.header.drivers}">Drivers</h3>
    <table class="table table-striped table-hover align-middle" th:if="${!race.drivers.empty}">
        <thead class="table-light">
        <tr>
            <th th:text="#{table.header.id}">ID</th>
            <th th:text="#{table.header.name}">Name</th>
            <th th:text="#{table.header.nationality}">Nationality</th>
            <th th:text="#{table.header.view}">View</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="driver : ${race.drivers}">
            <td th:text="${driver.id}"></td>
            <td th:text="${driver.name}"></td>
            <td th:text="${driver.nationality}"></td>
            <td>
                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{/drivers/{id}(id=${driver.id})}"
                   th:text="#{button.viewDetails}">View</a>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${race.drivers.empty}" class="text-muted">No drivers participating in this race.</p>

    <a class="btn btn-secondary mt-3" th:href="@{/races}">
        <i class="bi bi-arrow-left"></i>
        <span th:text="#{page.races.title}"></span>
    </a>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
