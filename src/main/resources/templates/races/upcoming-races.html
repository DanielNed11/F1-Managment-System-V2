<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head('Upcoming Races')}"></head>

  <body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="container my-4">
      <h1 class="mb-4">
        <i class="bi bi-calendar-event"></i> <span
          th:text="#{page.upcomingRaces.heading}"
        >Upcoming Races</span>
      </h1>

      <p class="lead" th:text="#{page.upcomingRaces.description}">
        Races that haven't ended yet
      </p>

      <table
        class="table table-striped table-hover"
        th:if="${!#lists.isEmpty(races)}"
      >
        <thead>
          <tr>
            <th th:text="#{table.header.id}">ID</th>
            <th th:text="#{table.header.name}">Name</th>
            <th th:text="#{table.header.date}">Date</th>
            <th th:text="#{table.header.track}">Track</th>
            <th th:text="#{table.header.status}">Status</th>
            <th th:text="#{table.header.view}">View</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="race : ${races}">
            <td th:text="${race.id}">1</td>
            <td>
              <a th:href="@{/races/{id}(id=${race.id})}" th:text="${race.name}"
              >Race Name</a>
            </td>
            <td th:text="${race.date}">2025-05-25</td>
            <td>
              <a
                th:if="${race.track != null}"
                th:href="@{/tracks/{id}(id=${race.track.id})}"
                th:text="${race.track.name}"
              >Track Name</a>
              <span th:unless="${race.track != null}" class="text-muted"
              >N/A</span>
            </td>
            <td>
              <span class="badge bg-success">
                <i class="bi bi-calendar-check"></i> <span
                  th:text="#{race.upcoming}"
                >Upcoming</span>
              </span>
            </td>
            <td>
              <a
                class="btn btn-sm btn-outline-primary"
                th:href="@{/races/{id}(id=${race.id})}"
                th:text="#{button.viewDetails}"
              >View</a>
            </td>
          </tr>
        </tbody>
      </table>

      <div th:if="${#lists.isEmpty(races)}" class="alert alert-info">
        <p th:text="#{msg.noUpcomingRaces}">No upcoming races found.</p>
      </div>

      <p class="mt-3">
        <strong
          th:text="#{label.totalUpcomingRaces} + ': ' + ${#lists.size(races)}"
        >Total Upcoming Races</strong>
      </p>

      <a th:href="@{/races}" class="btn btn-secondary mt-3">
        <i class="bi bi-arrow-left"></i> <span th:text="#{button.backToRaces}"
        >Back to All Races</span>
      </a>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
