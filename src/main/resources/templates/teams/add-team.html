<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(#{page.team.add.title})}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container my-4">
<h1 class="mb-4" th:text="#{page.team.add.heading}"></h1>

<form class="row g-3" th:action="@{/teams/add}" th:object="${team}" method="post">

    <div class="col-md-6">
        <label class="form-label" th:text="#{label.name} + ':'"></label>
        <input type="text" class="form-control" th:field="*{name}" required />
    </div>

    <div class="col-md-6">
        <label class="form-label" th:text="#{label.foundedYear} + ':'"></label>
        <input type="number" class="form-control" th:field="*{foundedYear}" required />
    </div>

    <div class="col-md-6">
        <label class="form-label" th:text="#{label.league} + ':'"></label>
        <select class="form-select" th:field="*{league}">
            <option th:each="l : ${T(application.domain.League).values()}"
                    th:value="${l.name()}"
                    th:text="${l.name().replace('_', ' ')}">
            </option>
        </select>
    </div>

    <div class="col-md-6">
        <label class="form-label" th:text="#{label.budget} + ':'"></label>
        <input type="number" class="form-control" th:field="*{budgetInMillions}" required />
    </div>

    <div class="col-12 d-flex justify-content-end">
        <button type="submit" class="btn btn-primary" th:text="#{button.addTeam}"></button>
    </div>

</form>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
