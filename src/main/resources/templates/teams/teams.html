<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/header :: head(#{page.teams.title})}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-4">
    <h1 class="mb-4" th:text="#{page.teams.heading}"></h1>

    <form class="row gy-2 gx-3 align-items-center mb-4" th:action="@{/teams}" method="get">
        <div class="col-auto">
            <select id="league-select" class="form-select" name="league" th:value="${league}">
                <option value="" th:text="#{option.allLeagues}">All Leagues</option>
                <option th:each="l : ${T(application.domain.League).values()}"
                        th:value="${l.name()}"
                        th:text="${l.name().replace('_', ' ')}">
                </option>
            </select>
        </div>

        <div class="col-auto d-flex align-items-end gap-2">
            <button type="submit" class="btn btn-primary" th:text="#{button.filter}"></button>
            <a class="btn btn-outline-secondary" th:href="@{/teams}" th:text="#{button.clear}"></a>
        </div>
    </form>

    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-4 g-4">
        <div class="col" th:each="team : ${teams}">
            <div class="card h-100 shadow-sm">
                <img class="card-img-top"
                     th:src="${team.teamLogoUrl}"
                     th:alt="${team.name}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${team.name}">Mercedes</h5>
                    <span class="badge text-bg-primary" th:text="${team.league != null ? team.league.replace('_', ' ') : ''}"></span>
                    <p class="card-text mt-2">
                        <span class="text-muted" th:text="#{label.foundedYear} + ':'">Founded in:</span>
                        <strong th:text="${team.foundedYear}">1950</strong>
                    </p>
                </div>
                <div class="card-footer bg-white">
                    <a class="btn btn-sm btn-outline-primary w-100"
                       th:href="@{/teams/{id}(id=${team.id})}"
                       th:text="#{button.viewDetails}"></a>
                </div>
            </div>
        </div>
    </div>

    <p class="mt-3"><strong th:text="#{label.totalTeams} + ': ' + ${#lists.size(teams)}">Total teams: 0</strong></p>
    <a class="btn btn-sm btn-primary w-100" th:text="#{button.addTeam}" th:href="@{/teams/add}"></a>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
