<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(#{page.track.add.title})}"></head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<h1 th:text="#{page.track.add.heading}"></h1>

<form th:object="${track}" th:action="@{/tracks/add}" method="post">
    <label th:text="#{label.trackName}"></label>
        <input type="text" th:field="*{name}" required />


    <label th:text="#{label.trackLocation}"></label>
        <input type="text" th:field="*{location}" required />


    <label th:text="#{label.length}"></label>
        <input type="number" th:field="*{lengthKm}" step="0.001" required />


    <label th:text="#{label.openedYear}"></label>
        <input type="number" th:field="*{openedYear}" required />


    <button type="submit" th:text="#{button.addTrack}"></button>
</form>
</body>
</html>
