<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Long Tracks')}"></head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container my-4">
    <h1 class="mb-4">
        <i class="bi bi-rulers"></i> <span th:text="#{page.longTracks.heading}">Long Tracks</span>
    </h1>

    <p class="lead" th:text="#{page.longTracks.description}">Tracks longer than 5 kilometers</p>

    <table class="table table-striped table-hover" th:if="${!#lists.isEmpty(tracks)}">
        <thead>
        <tr>
            <th th:text="#{table.header.id}">ID</th>
            <th th:text="#{table.header.name}">Name</th>
            <th th:text="#{track.type}">Type</th>
            <th th:text="#{table.header.location}">Location</th>
            <th th:text="#{table.header.length}">Length (km)</th>
            <th th:text="#{table.header.opened}">Opened</th>
            <th th:text="#{table.header.view}">View</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="track : ${tracks}">
            <td th:text="${track.id}">1</td>
            <td>
                <a th:href="@{/tracks/{id}(id=${track.id})}" th:text="${track.name}">Track Name</a>
            </td>
            <td>
                <span th:if="${trackTypes[track.id] == 'STREET'}"
                      class="badge bg-warning text-dark">
                    <i class="bi bi-buildings"></i> <span th:text="#{track.street}">Street</span>
                </span>
                <span th:if="${trackTypes[track.id] == 'PERMANENT'}"
                      class="badge bg-success">
                    <i class="bi bi-flag-fill"></i> <span th:text="#{track.permanent}">Permanent</span>
                </span>
                <span th:if="${trackTypes[track.id] == 'BASIC'}"
                      class="badge bg-secondary">
                    <span th:text="#{track.basic}">Basic</span>
                </span>
            </td>
            <td th:text="${track.location}">Location</td>
            <td>
                <strong class="text-primary" th:text="${track.lengthKm} + ' km'">5.5 km</strong>
            </td>
            <td th:text="${track.openedYear}">1950</td>
            <td>
                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{/tracks/{id}(id=${track.id})}"
                   th:text="#{button.viewDetails}">View</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(tracks)}" class="alert alert-info">
        <p th:text="#{msg.noLongTracks}">No long tracks found.</p>
    </div>

    <p class="mt-3">
        <strong th:text="#{label.totalLongTracks} + ': ' + ${#lists.size(tracks)}">Total Long Tracks</strong>
    </p>

    <a th:href="@{/tracks}" class="btn btn-secondary mt-3">
        <i class="bi bi-arrow-left"></i> <span th:text="#{button.backToTracks}">Back to All Tracks</span>
    </a>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
