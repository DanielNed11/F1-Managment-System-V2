<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(#{page.tracks.title})}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-4">
    <h1 class="mb-4" th:text="#{page.tracks.heading}">Track</h1>

    <table class="table table-striped table-hover align-middle">
        <thead class="table-light">
        <tr>
            <th th:text="#{table.header.id}">ID</th>
            <th th:text="#{table.header.name}">Name</th>
            <th th:text="#{table.header.location}">Location</th>
            <th th:text="#{table.header.length}">Length (km)</th>
            <th th:text="#{table.header.opened}">Opened Year</th>
            <th th:text="#{table.header.edit}">Edit</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td th:text="${track.id}"></td>
            <td><strong th:text="${track.name}"></strong></td>
            <td th:text="${track.location}"></td>
            <td th:text="${track.lengthKm}"></td>
            <td th:text="${track.openedYear}"></td>
            <td>
                <div class="d-flex gap-2">
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/tracks/edit/{id}(id=${track.id})}">
                        <i class="bi bi-pencil-square"></i>
                        <span th:text="#{table.header.edit}">Edit</span>
                    </a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <h3 class="mt-5 mb-3" th:text="#{table.header.races}">Races</h3>
    <table class="table table-striped table-hover align-middle" th:if="${!races.empty}">
        <thead class="table-light">
        <tr>
            <th th:text="#{table.header.id}">ID</th>
            <th th:text="#{table.header.name}">Name</th>
            <th th:text="#{table.header.date}">Date</th>
            <th th:text="#{table.header.winner}">Winner</th>
            <th th:text="#{table.header.view}">View</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="race : ${races}">
            <td th:text="${race.id}"></td>
            <td th:text="${race.name}"></td>
            <td th:text="${race.date}"></td>
            <td th:text="${race.winner != null ? race.winner.name : ''}"></td>
            <td>
                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{/races/{id}(id=${race.id})}"
                   th:text="#{button.viewDetails}">View</a>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${races.empty}" class="text-muted">No races held at this track.</p>

    <a class="btn btn-secondary mt-3" th:href="@{/tracks}">
        <i class="bi bi-arrow-left"></i>
        <span th:text="#{page.tracks.title}"></span>
    </a>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
