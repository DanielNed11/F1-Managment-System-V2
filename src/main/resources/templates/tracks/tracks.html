<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(#{page.tracks.title})}"></head>

<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<h1 th:text="#{page.tracks.heading}"></h1>

<table>
    <thead>
    <tr>
        <th th:text="#{table.header.id}"></th>
        <th th:text="#{table.header.name}"></th>
        <th th:text="#{table.header.location}"></th>
        <th th:text="#{table.header.length}"></th>
        <th th:text="#{table.header.opened}"></th>
        <th th:text="#{table.header.edit}"></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="track : ${tracks}">
        <td th:text="${track.id}"></td>
        <td th:text="${track.name}"></td>
        <td th:text="${track.location}"></td>
        <td th:text="${track.lengthKm}"></td>
        <td th:text="${track.openedYear}"></td>
        <td>
            <div class="d-flex gap-2">
                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{/tracks/edit/{id}(id=${track.id})}" th:text="#{table.header.edit}"></a>
                <form th:action="@{/tracks/{id}/delete(id=${track.id})}" method="post"
                      onsubmit="return confirm('Are you sure you want to delete this track?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </div>
        </td>
    </tr>
    </tbody>
</table>
<p>
    <strong th:text="#{label.totalTracks} + ': ' + ${#lists.size(tracks)}"></strong>
</p>
</body>
</html>
